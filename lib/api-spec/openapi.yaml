openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Whop store, products, checkouts, and sales
  - name: agent
    description: Arabic store assistant
  - name: settings
    description: Integration and account status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /whop/status:
    get:
      operationId: getWhopStatus
      tags: [settings]
      summary: Check Whop integration readiness
      responses:
        "200":
          description: Current integration state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"
  /whop/overview:
    get:
      operationId: getStoreOverview
      tags: [store]
      summary: Get store totals and recent sales
      responses:
        "200":
          description: Store overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOverview"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /whop/plans:
    get:
      operationId: listStorePlans
      tags: [store]
      summary: List digital products and prices from Whop
      responses:
        "200":
          description: Whop plans normalized for the store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorePlan"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Whop permissions or company configuration are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createStoreProduct
      tags: [store]
      summary: Create a Whop product and its one-time payment plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product and plan created in Whop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePlan"
        "400":
          description: Invalid product information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Whop permissions or company configuration are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /whop/checkout:
    post:
      operationId: createStoreCheckout
      tags: [store]
      summary: Create a hosted Whop checkout link for a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Hosted checkout link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutLink"
        "400":
          description: Invalid plan ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Whop permissions or company configuration are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /whop/payments:
    get:
      operationId: listStorePayments
      tags: [store]
      summary: List recent Whop payments
      responses:
        "200":
          description: Recent payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorePayment"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Whop permissions or company configuration are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /agent/chat:
    post:
      operationId: sendAgentMessage
      tags: [agent]
      summary: Send a text message to the Arabic store assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMessageInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessageResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI service is not enabled for this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /digital-products:
    get:
      operationId: listDigitalProducts
      tags: [digital-products]
      summary: List the authenticated user's digital products
      responses:
        "200":
          description: Digital product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DigitalProduct"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createDigitalProduct
      tags: [digital-products]
      summary: Add a digital product to the authenticated user's catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDigitalProductInput"
      responses:
        "201":
          description: Created digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /digital-products/{id}:
    delete:
      operationId: deleteDigitalProduct
      tags: [digital-products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
  /digital-products/{id}/download:
    get:
      operationId: downloadDigitalProduct
      tags: [digital-products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Download the generated Markdown product
          content:
            text/markdown:
              schema:
                type: string
  /agent/speech:
    post:
      operationId: synthesizeAgentSpeech
      tags: [agent]
      summary: Synthesize assistant speech using the configured server-side provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSpeechInput"
      responses:
        "200":
          description: Synthesized audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Speech provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /agent/assets:
    get:
      operationId: listAgentAssets
      tags: [agent-assets]
      summary: List uploaded assets for the authenticated user
      responses:
        "200":
          description: Uploaded assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentAsset"
    post:
      operationId: uploadAgentAsset
      tags: [agent-assets]
      summary: Upload an asset up to 20 MB
      parameters:
        - in: header
          name: X-Asset-Name
          required: true
          schema:
            type: string
        - in: header
          name: X-Asset-Type
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAsset"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /agent/assets/{id}:
    delete:
      operationId: deleteAgentAsset
      tags: [agent-assets]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Asset deleted
        "404":
          description: Asset not found
  /agent/assets/{id}/download:
    get:
      operationId: downloadAgentAsset
      tags: [agent-assets]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Download asset
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    IntegrationStatus:
      type: object
      required: [whop, whatsapp, binance, ai, message]
      properties:
        whop:
          type: string
          enum: [ready, permissions_required, not_connected, configuration_required]
        whatsapp:
          type: string
          enum: [ready, not_connected]
        binance:
          type: string
          enum: [ready, unavailable]
        ai:
          type: string
          enum: [ready, upgrade_required]
        message:
          type: string
    StoreOverview:
      type: object
      required: [currency, revenue, paymentCount, customerCount, productCount, recentPayments, integrationState]
      properties:
        currency:
          type: string
        revenue:
          type: ["number", "null"]
        paymentCount:
          type: integer
        customerCount:
          type: integer
        productCount:
          type: integer
        recentPayments:
          type: array
          items:
            $ref: "#/components/schemas/StorePayment"
        integrationState:
          type: string
          enum: [ready, permissions_required, not_connected, configuration_required]
    StorePlan:
      type: object
      required: [id, productId, title, description, price, currency, language, createdAt]
      properties:
        id:
          type: string
        productId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        currency:
          type: string
        language:
          type: string
          enum: [ar, en]
        createdAt:
          type: ["string", "null"]
          format: date-time
    StorePayment:
      type: object
      required: [id, amount, currency, status, buyerName, productTitle, createdAt]
      properties:
        id:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
        buyerName:
          type: ["string", "null"]
        productTitle:
          type: ["string", "null"]
        createdAt:
          type: ["string", "null"]
          format: date-time
    ProductInput:
      type: object
      required: [title, description, price, currency, language]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 2000
        price:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          enum: [usd]
        language:
          type: string
          enum: [ar, en]
    CheckoutInput:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
          minLength: 1
    CheckoutLink:
      type: object
      required: [purchaseUrl]
      properties:
        purchaseUrl:
          type: string
          format: uri
    AgentMessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 12
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 4000
        digitalProducts:
          type: array
          maxItems: 50
          items:
            type: object
            required: [title, description, price, downloadUrl]
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 120
              description:
                type: string
                maxLength: 2000
              price:
                type: number
                exclusiveMinimum: 0
              downloadUrl:
                type: string
                format: uri
    AgentSpeechInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    AgentMessageResponse:
      type: object
      required: [reply, language]
      properties:
        reply:
          type: string
        language:
          type: string
          enum: [ar, en]
        generatedProduct:
          $ref: "#/components/schemas/DigitalProduct"
        generatedAsset:
          $ref: "#/components/schemas/AgentAsset"
    AgentAsset:
      type: object
      required: [id, name, contentType, size, downloadUrl, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
        downloadUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    DigitalProduct:
      type: object
      required: [id, title, description, price, downloadUrl, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        downloadUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    CreateDigitalProductInput:
      type: object
      required: [title, description, price]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 2000
        price:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        downloadUrl:
          type: string
          format: uri
        content:
          type: string
          maxLength: 50000

